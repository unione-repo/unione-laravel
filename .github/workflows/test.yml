# Generated: the tests of the package on every push and pull request (and before a release). Do not edit, the next
# release replaces it. The tests need no network: the API is faked.
name: Tests

on:
  push:
    branches: ["**"]  # not the tags: release.yml runs the tests of a tag itself
  pull_request:
  workflow_call:

permissions:
  contents: read

# a new push of the ref cancels the run of the previous one (called by release.yml: the group of the tag)
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the SDK unione-repo/unione-php-sdk 2.3.1 in Packagist
        timeout-minutes: 15
        run: |
          for i in $(seq 1 20); do
            if curl -fsSL -A "release-workflow (github.com/$GITHUB_REPOSITORY)" -o /tmp/sdk "https://repo.packagist.org/p2/unione-repo/unione-php-sdk.json" && grep -qF '"version":"2.3.1"' /tmp/sdk; then
              echo "unione-repo/unione-php-sdk 2.3.1 is in Packagist"; exit 0
            fi
            echo "unione-repo/unione-php-sdk 2.3.1 is not in Packagist yet ($i/20)"; sleep 30
          done
          echo "::error::unione-repo/unione-php-sdk 2.3.1 did not appear in Packagist in 10 min: publish the SDK first"; exit 1
  test:
    needs: sdk
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        v: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.v }}
          tools: composer
          coverage: none
      - name: Composer installs the versions with security advisories too (the tests check the declared range)
        run: |
          echo "COMPOSER_NO_BLOCKING=1" >> "$GITHUB_ENV"
          echo "COMPOSER_NO_SECURITY_BLOCKING=1" >> "$GITHUB_ENV"
      - name: Install the dependencies (the mirrors of the registry may serve the SDK some minutes later)
        timeout-minutes: 15
        run: |
          for i in $(seq 1 20); do
            if ( composer clear-cache -q && composer install --no-interaction --no-progress ) > /tmp/install.log 2>&1; then cat /tmp/install.log; exit 0; fi
            cat /tmp/install.log
            if ! grep -qiF 'unione-repo/unione-php-sdk' /tmp/install.log; then
              echo "::error::the dependencies can not be installed, not because of the SDK unione-repo/unione-php-sdk: see above"; exit 1
            fi
            echo "the dependencies can not be installed yet: the SDK unione-repo/unione-php-sdk ($i/20)"; sleep 30
          done
          echo "::error::the dependencies (the SDK) can not be installed in 10 min"; exit 1
      - run: |
          composer install --no-interaction --no-progress && vendor/bin/phpunit
